<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCA AETERNA | Digital Vault</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 1. RESET TOTAL & FORCE FULLSCREEN */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #0a0014; /* Warna dasar jika gambar gagal */
        }

        body { 
            /* Menggunakan url relatif ke folder assets */
            background: linear-gradient(rgba(10, 0, 20, 0.75), rgba(10, 0, 20, 0.75)), 
                        url('assets/bg.png') no-repeat center center fixed;
            background-size: cover !important;
            color: #e0e0e0; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 2. LAYOUT CONTAINER */
        .main-wrapper {
            width: 100%;
            max-width: 1200px; /* Lebar maksimal konten tengah */
            padding: 40px 20px;
            z-index: 1;
        }

        /* 3. NEON & GLASS EFFECT */
        .neon-border { 
            border: 1px solid #bc13fe; 
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4); 
        }
        .neon-text { 
            color: #bc13fe; 
            text-shadow: 0 0 10px #bc13fe; 
        }
        .glass { 
            background: rgba(15, 0, 30, 0.8); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(188, 19, 254, 0.2);
        }
        .card-locked { border-left: 4px solid #ff00ff; }
        .card-ready { border-left: 4px solid #00ffaa; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0a001a; }
        ::-webkit-scrollbar-thumb { background: #bc13fe; border-radius: 10px; }

        /* Animasi Input */
        input, textarea {
            background: rgba(0, 0, 0, 0.5) !important;
            border: 1px solid rgba(188, 19, 254, 0.2) !important;
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus {
            border-color: #bc13fe !important;
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.3);
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <header class="mb-12 text-center">
            <h1 class="text-5xl md:text-6xl font-bold neon-text mb-2 tracking-tighter italic">ARCA AETERNA</h1>
            <p class="text-[10px] md:text-xs tracking-[0.4em] opacity-60 uppercase font-sans text-purple-300">Advanced Future Archive Protocol</p>
        </header>

        <div class="grid md:grid-cols-2 gap-10">
            <!-- INPUT SECTION -->
            <section class="glass p-8 rounded-2xl neon-border">
                <h2 class="text-lg mb-6 uppercase tracking-widest font-bold text-purple-400 flex items-center">
                    <span class="mr-2">⚡</span> Segel Kapsul
                </h2>
                <div class="space-y-5">
                    <input type="text" id="title" placeholder="JUDUL ARSIP" class="w-full p-3 rounded focus:outline-none text-white uppercase text-sm tracking-widest">
                    <textarea id="message" placeholder="TULIS PESAN MASA DEPAN..." class="w-full p-3 rounded h-40 focus:outline-none text-white text-sm"></textarea>
                    <input type="email" id="targetEmail" placeholder="EMAIL PENERIMA" class="w-full p-3 rounded focus:outline-none text-white">
                    
                    <div class="bg-black/40 p-4 rounded border border-purple-900/30">
                        <label class="text-[10px] block mb-2 opacity-50 uppercase tracking-widest text-purple-400">Waktu Pembukaan (Unlock Date):</label>
                        <input type="datetime-local" id="unlockDate" class="w-full bg-transparent border-none text-white focus:outline-none [color-scheme:dark]">
                    </div>

                    <button onclick="saveCapsule()" class="w-full bg-gradient-to-r from-purple-900 to-fuchsia-700 hover:from-fuchsia-700 hover:to-purple-900 text-white font-bold py-4 px-4 rounded-xl transition-all duration-300 shadow-lg hover:shadow-purple-500/50 uppercase tracking-widest text-xs">
                        Inisialisasi Enkripsi & Simpan
                    </button>
                </div>
            </section>

            <!-- VAULT SECTION -->
            <section>
                <h2 class="text-lg mb-6 uppercase tracking-widest font-bold text-purple-400 flex items-center">
                    <span class="mr-2">📂</span> Arsip Digital Vault
                </h2>
                <div id="vaultGrid" class="space-y-4 overflow-y-auto max-h-[600px] pr-3">
                    <div class="flex flex-col items-center justify-center h-40 opacity-30">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500 mb-4"></div>
                        <p class="text-[10px] uppercase tracking-widest">Memindai tanda tangan digital...</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const USER_ID = "lutfi_user_test"; 
        const SECRET_KEY = "KUNCI_RAHASIA_AETERNA_91_YEARS"; 

        async function saveCapsule() {
            const rawMessage = document.getElementById('message').value;
            const title = document.getElementById('title').value;
            const email = document.getElementById('targetEmail').value;
            const date = document.getElementById('unlockDate').value;

            if(!rawMessage || !title || !email || !date) {
                return alert("⚠️ Protokol Gagal: Semua kolom harus diisi.");
            }

            // Enkripsi AES di sisi klien
            const encryptedMessage = CryptoJS.AES.encrypt(rawMessage, SECRET_KEY).toString();

            const data = {
                title: title,
                message: encryptedMessage,
                targetEmail: email,
                unlockDate: date,
                userId: USER_ID
            };

            try {
                const res = await fetch('/api/capsules', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if(res.ok) {
                    alert("🔒 DATA TERENKRIPSI: Kapsul telah berhasil disegel dalam vault.");
                    location.reload();
                }
            } catch (err) {
                alert("❌ Kegagalan Sistem: Tidak dapat menghubungi server.");
            }
        }

        async function loadVault() {
            const grid = document.getElementById('vaultGrid');
            try {
                const res = await fetch(`/api/capsules/${USER_ID}`);
                const data = await res.json();
                grid.innerHTML = '';

                if (data.length === 0) {
                    grid.innerHTML = '<p class="text-purple-700 text-xs italic text-center py-10 uppercase tracking-widest opacity-50">Vault masih kosong.</p>';
                    return;
                }

                data.forEach(c => {
                    const isLocked = new Date() < new Date(c.unlockDate);
                    const card = document.createElement('div');
                    card.className = `glass p-5 rounded-xl border border-purple-900/20 ${isLocked ? 'card-locked' : 'card-ready'} hover:border-purple-500/50 transition-all cursor-pointer group`;
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-sm text-purple-100 uppercase tracking-tighter group-hover:text-purple-400 transition-colors">${c.title}</h3>
                            <span class="text-[8px] px-2 py-1 rounded border ${isLocked ? 'text-pink-500 border-pink-500' : 'text-emerald-400 border-emerald-400'} font-bold">
                                ${isLocked ? 'LOCKED' : 'READY'}
                            </span>
                        </div>
                        <p class="text-[10px] text-purple-300/50 truncate mb-3">${c.targetEmail}</p>
                        <div class="flex justify-between items-center opacity-40">
                             <p class="text-[9px] tracking-widest font-bold">DEEP STORAGE</p>
                             <p class="text-[9px]">${new Date(c.unlockDate).toLocaleString()}</p>
                        </div>
                    `;

                    if(!isLocked) {
                        card.onclick = () => {
                            try {
                                const bytes = CryptoJS.AES.decrypt(c.message, SECRET_KEY);
                                const original = bytes.toString(CryptoJS.enc.Utf8);
                                if(!original) throw new Error();
                                alert(`🔓 PESAN TERDEKRIPSI:\n\n"${original}"`);
                            } catch(e) {
                                alert("❌ Error: Kunci enkripsi tidak cocok.");
                            }
                        };
                    } else {
                        card.onclick = () => {
                            const remaining = new Date(c.unlockDate) - new Date();
                            const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
                            alert(`🔒 STATUS: TERSEGEL\nKapsul ini baru bisa dibuka dalam ${days} hari lagi.`);
                        };
                    }
                    grid.appendChild(card);
                });
            } catch (e) { 
                grid.innerHTML = '<p class="text-red-900 text-xs text-center">❌ Koneksi Vault Terputus.</p>'; 
            }
        }
        window.onload = loadVault;
    </script>
</body>
</html>
